config_examples:
- config: experiments/smoke
  allow_missing: false
- config: experiments/smoke
  overrides:
  - optimizer=sgd
  - optimizer.lr=3e-5
- config: experiments/smoke
  overrides:
  - optimizer=adamw
  - optimizer.lr=3e-5
- config: experiments/smoke
  overrides:
  - optimizer=adam_frozen
  - optimizer.lr=3e-5
- config: experiments/smoke
  overrides:
  - optimizer=sgd_momentum
  - optimizer.lr=3e-5
- config: experiments/smoke
  overrides:
  - optimizer=adamw_prewarmed
  - optimizer.lr=3e-5
- config: experiments/smoke
  overrides:
  - train.max_response_tokens=48
