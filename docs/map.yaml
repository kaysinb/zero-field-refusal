version: 1
package: zero_field_refusal
documents:
- path: README.md
  purpose: Repository overview and working quick start
- path: docs/README.md
  purpose: Generated document/topic index and maintenance workflow
- path: docs/design.md
  purpose: Scientific rationale, evidence, controls and references
- path: docs/preregistration.md
  purpose: Authoritative hypotheses, analysis, gate criteria and amendments
- path: docs/plan.md
  purpose: Stages, progression, failure paths and hardware
- path: docs/architecture.md
  purpose: Engineering design, implementation invariants and run identity
- path: docs/operations.md
  purpose: Environment, configuration, execution, storage and release procedures
- path: docs/decisions.md
  purpose: Historical gate decisions and protocol-version changes
- path: docs/reports/README.md
  purpose: Conventions for historical reports and their evidence
historical_docs:
- docs/reports/*.md
topics:
- id: research_question
  title: Research question and prior-work positioning
  source: docs/design.md#related-work-and-novelty
  review:
  - README.md#the-question
  - docs/design.md#the-zero-field-experiment
  - docs/design.md#references
- id: zero_field_protocol
  title: Binding zero-field protocol and its implementation
  source: docs/preregistration.md#fixed-protocol
  review:
  - docs/design.md#the-zero-field-experiment
  - docs/architecture.md#zero-field-invariants
  - docs/architecture.md#generation-settings
  - docs/architecture.md#precision
  - docs/architecture.md#loss-units
  - configs/protocol/zero_field.yaml
  - configs/model/qwen2.5-0.5b-instruct.yaml
  - configs/model/qwen2.5-1.5b-instruct.yaml
  - configs/control/token_count.yaml
  - configs/control/sharpened_sampling.yaml
  - configs/control/alpaca_reference.yaml
  - configs/control/soft_targets.yaml
