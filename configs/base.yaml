# Settings shared by every run. Experiment configs list this file first under `defaults`.
experiment: scratch         # groups runs: runs/<experiment>/ and the W&B group
name: null                  # optional label added to the run id
seed: 0                     # run seed; per-purpose streams derive from it (seeding.derive_seed)
run_type: train             # train | theta0 (evaluates the starting model) | checks (stage 0)
protocol_version: 1         # part of the config hash; bump on any change to code or data that
                            # alters results, so the launcher never skips a cell from older code

tracking:
  require_clean_git: false  # true for gate runs, so every result maps to a commit
  gate: null                # 1 or 2: the gate whose evidence the run is; the analysis of
                            # Gate 2 runs needs the frozen K* (scripts/build_analysis.py --k-star)
  update_scalars: false     # a scheduled Adam run's update scalars, update_scalars.jsonl
                            # (schedule.UpdateScalars); logging only, numerics unchanged
  wandb:
    enabled: true
    required: false         # true: a failure to start W&B stops the run
    project: zero-field-refusal
    tags: []

execution:                  # how a run executes, not what it computes; excluded from the config hash
  device: cuda
  micro_batch_size: 4       # gradient accumulation is exact with the constant denominator
  eval_batch_size: 32
  generation_batch_size: 32
