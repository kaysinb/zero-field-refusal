# Study 2: the diagnostic of the FA soft-control failure (docs/study2-fa-control-diagnostic.md,
# frozen; Revision 1 supersedes its base text). Not a run config: scripts/fa_control_diagnostic.py
# reads these settings beside the archived configs of the runs it re-examines, and every
# computation uses the archived run's own config. Outside the confirmation and blind to outcomes:
# every evaluation is K-only, on the scoring panel's benign responses (kl_benign) and the monitor
# panel; no harmful prompt set, stream or generation, and no refusal, harm or judge quantity
# (tests/test_fa_control_diagnostic.py asserts both). Outputs: RUNS_DIR/diagnostics/fa_control/.
experiment: fa_control_diagnostic
diagnostic:
  evaluation: k_only                # asserted by a test, with the absence of harmful generation
  harmful_generation: false
  seed: 2000                        # the targeted round's runs and the FA soft controls
  batch_size: 5
  epsilon: 1.0e-8                   # FA's ε (configs/optimizer/adam_frozen.yaml)
  bound: 0.0632455532033676         # 0.01 K* (K* = √40): the controls' contamination_k
  experiments:
    regular: study2_short
    control: study2_short_fa_controls
  controls: [1.0e-05, 1.21e-05, 1.46e-05]  # the FA soft controls' rates, as recorded
  d1:
    pair: fa-1.21e-05               # the regular run and the control checked for shared state
    same_path_control:              # Branch F's same-path float64 soft control
      rate: 1.21e-05
      k_at: [1, 5, 10, 15, 20, 25]  # K on the scoring panel (D3's measurement steps)
    # The residual "comes from the path discrepancy" when the fp32 same-path residual (i) is at
    # most this share of the recorded one (iii), in norm. The specification names the condition
    # without a number: this operationalization awaits the coordinator's confirmation.
    path_share_max: 0.1
  d2:
    batches: 4                      # the control's first 4 batches, cycled over the run's steps
    rates: [1.0e-05, 1.21e-05, 1.46e-05]
    lanczos:
      steps: 60                     # as the Stage-A curvature measurement (review r9)
      tolerance: 0.01
    fisher_at: [1, 5, 10, 15, 20, 25]  # where δᵀFδ is read (F: the 4 batches' soft Hessian)
  d3:
    eval_at: [1, 5, 10, 15, 20, 25]
    determinism: fa-1e-05           # the targeted round's FA run of seed 2000 at the low rate
    order: [fa-1.21e-05, fa-1e-05, adamw-1.32e-05]
    expansion: fa-1.46e-05          # only if the three cases give the ambiguous branch
    cases:                          # lr: the archived regular run's rate; control_lr: the FA
                                    # soft control's, whose first-step displacement norm scales
                                    # the perturbations
      fa-1.21e-05: {optimizer: adam_frozen, lr: 1.21e-05, control_lr: 1.21e-05}
      fa-1e-05: {optimizer: adam_frozen, lr: 9.98e-06, control_lr: 1.0e-05}
      adamw-1.32e-05: {optimizer: adamw, lr: 1.32e-05, control_lr: 1.32e-05}
      fa-1.46e-05: {optimizer: adam_frozen, lr: 1.46e-05, control_lr: 1.46e-05}
    gaussian:                       # seeds of the fixed directions p3 and p4
      p3: 3
      p4: 4
    rounding_scale: 10              # a perturbation lost to fp32 rounding is scaled once
  branches:
    failing: fa-1.21e-05
    regular_cases: [fa-1.21e-05, fa-1e-05]  # Branch F's "regular runs stay within the bound"
