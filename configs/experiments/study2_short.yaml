# Study 2, amendment 3 (the short regime, design A): the regular runs of AdamW-25, FA-25
# (optimizer=adam_frozen) and pre-warmed AdamW-25 (optimizer=adamw_prewarmed), exactly 25 steps
# evaluated at step 25 and stopped early only by instability (the ×10 gradient rule included),
# under monitor version 2. Everything but the experiment's name and the role equals Stage A's
# 25-step runs (experiments/study2_stage_a with schedule=short), so that the new discovery runs
# pool with Stage A's grids (tests/test_study2_short_campaigns.py compares the two). The arm,
# batch, rate, role and seed of each run come from the campaigns that
# scripts/study2_short_campaigns.py writes; the role is `???`, so a run without it fails at load.
# Results count: runs from a clean checkout of a commit.
defaults:
  - base
  - protocol/zero_field
  - model/qwen2.5-1.5b-instruct
  - optimizer/adamw
  - data/study2
  - eval/study2
  - schedule/short

experiment: study2_short
protocol_version: 2                 # decisions.md, "Protocol versions"
study2_short:
  role: ???                         # discovery (seeds 2000-2002), numerical (2200-2202, run
                                    # with experiments/study2_short_k_only: K-only, never
                                    # blocks), validation (2100-2111) or confirmation
                                    # (3000-3079) (analysis.study2_short)
teacher:
  stream: appendable
  chunk_size: 1000
eval:
  projections: 0
tracking:
  require_clean_git: true
