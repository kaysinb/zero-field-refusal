# Study 5's fresh F run at η_l (docs/study5-preregistration.md, "Descriptive measurements", "Line
# scans"): experiments/study5 as a fresh seed's run, its line θ₀ + aΔθ scanned after the last
# evaluation at the registered coefficients besides the endpoint a = +1 (schedule.run_line_scan,
# conditions line_scan_{a:+g}). The rate (η_l = 1.3e-05), the seed and the endpoint checkpoint's
# directory (tracking.endpoint_checkpoint, outside the config hash) come from the campaign. The
# same config, rate and seed are the predictor's (scripts/study5_predict.py), the stream
# features' and the ladder's (scripts/study5_ladder.py): each names this run's config hash.
# The fresh run at η_u is experiments/study5 with study5.role=fresh: no scan, no checkpoint.
defaults:
  - experiments/study5

study5:
  role: fresh
eval:
  controls:
    line_scan:
      points: [-1, -0.5, -0.25, 0.25, 0.5]
