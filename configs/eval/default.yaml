eval:
  harmful:                        # behavior on the judged harmful prompts (configs/data/)
    prompt_set: harmful_judged    # harmful_calibration only in judge-calibration runs
    decoding: greedy
    max_new_tokens: 256
    limit: null                   # evaluate only the first n prompts (smoke runs); null: all
  kl:                             # K: exact per-position KL to the frozen θ₀ along its responses
    samples_per_prompt: 4
    max_new_tokens: 96
    limit: null
  utility:
    heldout_reference_nll: true   # loss on unseen Alpaca reference answers
    factual_qa: true
    benchmark: true               # MMLU subset scored by likelihood
  refusal_keywords: v1            # keyword list version, recorded next to the judge labels
  projections: 2                  # fixed random directions for gradient and displacement
                                  # statistics; each costs the trainable size in pinned CPU memory
  controls:                       # run in-process on the trained weights, when enabled
    line_scan:                    # θ₀ + a·Δθ along the whole displacement, both signs
      enabled: false
      coefficients: [0.25, 0.5, 1.0]
      signs: [1, -1]
      # points: absent. Study 5's line scan of a scheduled run (study5.role fresh only): the signed
      # coefficients a of θ₀ + aΔθ, each evaluated in full after the last evaluation under the
      # condition line_scan_{a:+g} (schedule.run_line_scan); enabled/coefficients/signs above are
      # the unscheduled runs'. Absent here so that no config changes its hash.
    random_direction:             # random displacements with the norm of Δθ
      enabled: false
      kinds: [global, per_tensor]
