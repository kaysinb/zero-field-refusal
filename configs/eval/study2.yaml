# Study 2 evaluation (docs/study2-preregistration.md, "Panels"): the scoring panel of study 1 (K on
# 100 benign and 100 harmful prompts × 4 θ₀ responses, MMLU, factual questions) at full
# evaluations, greedy responses to the harmful evaluation set, and the monitor panel, read during
# training to place the full evaluations.
defaults: [eval/default]
eval:
  harmful:
    prompt_set: harmful_evaluation  # data/study2: 521 prompts outside the K prompts
  monitor:                          # version 2 (amendment 1): stream kl_monitor v2
    version: 2                      # (version 1, the discovery grids': 25 alpaca_monitor prompts × 2)
    prompt_set: alpaca_benign_kl    # the scoring panel's own 100 prompts
    samples_per_prompt: 2           # fresh θ₀ responses per prompt, seeds of their own
    drive: 1                        # m: the first m of each prompt are read every `every` steps
    every: 5                        # steps between readings
    cache:                          # θ₀'s logits: device (GPU), host (CPU memory) or none
      primary: host                 # not on the GPU: a B = 20 run already holds ≈ 37.6 of 45 GB
      secondary: host               # read only at diagnostic states and full evaluations
  diagnostics:                      # the scoring panel's K alone, no harm, no utility
    every: 25                       # steps; fixed
    cache: host
  # rayleigh: the endpoint Rayleigh quotient, off by default: absent here, so that these configs
  # keep their hash; an experiment turns it on by adding eval/rayleigh to its defaults.
